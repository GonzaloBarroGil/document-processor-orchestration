openapi: 3.1.0
info:
  title: Document Processor — Family API
  version: 1.0.0
  x-status: Approved v1.0
  description: |
    Unified OpenAPI 3.1 contract for the document/invoice processing product family.
    This file is the **single source of truth** (decision D5), owned by the
    `document-processor-orchestration` governance repo and consumed by the web service
    (implementation), the web app, and the mobile app (generated TypeScript clients).

    Sources:
    - `document-processor` `/api/v1` endpoints (promoted as-is — API-stability rule).
    - New family endpoints for auth (D9), review/export (web app), and cost controls (D12).

    Authentication:
    - **Machine clients**: `X-API-Key` header (SHA-256 hashed at rest; no self-service endpoints).
    - **Human users** (web + mobile): JWT Bearer + rotating refresh tokens, roles `ADMIN`/`REVIEWER`.
    - Operations listed with both schemes accept **either** credential.

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.example.com
    description: Production (self-host VPS behind Cloudflare — D11)

tags:
  - name: health
    description: Liveness/readiness (unauthenticated)
  - name: auth
    description: Human-user authentication (JWT + refresh)
  - name: documents
    description: Ingestion, status, listing, image retrieval
  - name: review
    description: Human-in-the-loop review queue + manual fix/export
  - name: api-keys
    description: Machine-client API key administration (ADMIN)
  - name: dashboard
    description: Processing summary (counts by status + recent activity)

security: []

paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Service health
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate a human user
      description: Exchanges credentials for an access + refresh token pair. Rate-limited (see D12).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "422":
          $ref: "#/components/responses/ValidationError"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the current refresh token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/documents:
    post:
      tags: [documents]
      summary: Ingest a document for OCR processing
      description: |
        Submits an image/PDF for async processing. Returns 202 with the document id.
        Enforced guards (D12): rate limit 60 req/min per key, global daily cap 100 docs/day.
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type, region]
              properties:
                file:
                  type: string
                  format: binary
                  description: image/jpeg, image/png, image/heic, application/pdf (max 10 MB)
                type:
                  $ref: "#/components/schemas/DocumentType"
                region:
                  type: string
                  description: ISO 3166-1 alpha-2 region code (defaults to AR)
                  default: AR
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [documents]
      summary: List documents (paginated, filterable)
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/DocumentType"
        - name: region
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/documents/{document_id}:
    get:
      tags: [documents]
      summary: Retrieve a document with parsed data and validation result
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/documents/{document_id}/image:
    get:
      tags: [documents]
      summary: Download the stored image
      description: Returns the original image (image/jpeg). Presigned URLs only in production (D12).
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Image expired by storage lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/documents/{document_id}/review:
    patch:
      tags: [review]
      summary: Record a manual review decision / fix extracted fields
      description: Human-in-the-loop review (ADMIN/REVIEWER). Updates the manual-fix flag and edited fields.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/documents/{document_id}/export:
    get:
      tags: [review]
      summary: Export a document's extracted data
      description: Returns a flattened, export-ready representation (JSON; CSV via Accept header).
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Export payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentExport"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/review/queue:
    get:
      tags: [review]
      summary: List documents awaiting human review
      description: Documents flagged for manual review (e.g. VALIDATION_FAILED or manual-fix requested).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/api-keys:
    get:
      tags: [api-keys]
      summary: List machine-client API keys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [api-keys]
      summary: Create a machine-client API key
      description: The raw key is returned once and stored only as a SHA-256 hash.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreateRequest"
      responses:
        "201":
          description: Created API key (raw key shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/api-keys/{prefix}/revoke:
    post:
      tags: [api-keys]
      summary: Revoke a machine-client API key
      security:
        - bearerAuth: []
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dashboard:
    get:
      tags: [dashboard]
      summary: Processing summary for the dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Machine-client key (SHA-256 hashed at rest; managed via admin CLI).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human-user JWT (web + mobile).

  parameters:
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing/invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Malformed request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: File exceeds the size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Unsupported media type or invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed (FastAPI/Pydantic)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorDetail"
    RateLimited:
      description: Rate limit or daily quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until retry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    DocumentType:
      type: string
      enum: [invoice, ticket, payment_receipt]

    DocumentStatus:
      type: string
      enum:
        [PENDING, OCR_IN_PROGRESS, VALIDATING, COMPLETED, VALIDATION_FAILED, OCR_FAILED, IMAGE_EXPIRED]

    MediaType:
      type: string
      enum: [image/jpeg, image/png, image/heic, application/pdf]

    UserRole:
      type: string
      enum: [ADMIN, REVIEWER]

    HealthResponse:
      type: object
      required: [status, ocr_engine, storage_pct]
      properties:
        status:
          type: string
          enum: [ok]
        ocr_engine:
          type: string
        storage_pct:
          type: number

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ValidationErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  type: [string, integer]
              msg:
                type: string
              type:
                type: string
              input: {}

    IngestResponse:
      type: object
      required: [document_id, status, image_key]
      properties:
        document_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DocumentStatus"
        image_key:
          type: string

    RecipientData:
      type: object
      properties:
        name:
          type: [string, "null"]
        cuit:
          type: [string, "null"]
        individual_amount:
          type: [number, "null"]
        fields:
          type: object
          additionalProperties:
            type: string

    ParsedData:
      type: object
      required: [raw_text, confidence, fields]
      properties:
        raw_text:
          type: string
        confidence:
          type: number
        fields:
          type: object
          description: |
            Extracted AFIP/invoice fields. Known keys: total_amount, date, vendor_name,
            tipo_comprobante, cuit_emisor, cae, cae_vencimiento, iva, total.
          additionalProperties:
            type: string
        recipients:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/RecipientData"

    ValidationError:
      type: object
      required: [field, rule, message]
      properties:
        field:
          type: string
        rule:
          type: string
        message:
          type: string

    ValidationResult:
      type: object
      required: [passed, errors, region, validated_at]
      properties:
        passed:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        region:
          type: string
        validated_at:
          type: string
          format: date-time

    Document:
      type: object
      required:
        [id, type, region, status, media_type, image_key, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/DocumentType"
        region:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        media_type:
          $ref: "#/components/schemas/MediaType"
        image_key:
          type: string
        user_id:
          type: [string, "null"]
          format: uuid
          description: Owner (human user) — nullable for machine-client submissions (D9).
        parsed_data:
          $ref: "#/components/schemas/ParsedData"
        validation_result:
          $ref: "#/components/schemas/ValidationResult"
        error_detail:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentList:
      type: object
      required: [items, total, page, pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        total:
          type: integer
        page:
          type: integer
        pages:
          type: integer

    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.

    ReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, request_changes]
        edited_fields:
          type: object
          description: Corrected extracted fields (manual fix).
          additionalProperties:
            type: string
        comment:
          type: [string, "null"]

    DocumentExport:
      type: object
      required: [document_id, type, region, status, parsed_data]
      properties:
        document_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/DocumentType"
        region:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        parsed_data:
          $ref: "#/components/schemas/ParsedData"
        validation_result:
          $ref: "#/components/schemas/ValidationResult"

    ApiKeyCreateRequest:
      type: object
      properties:
        label:
          type: [string, "null"]

    ApiKeyCreateResponse:
      type: object
      required: [key, prefix]
      properties:
        key:
          type: string
        prefix:
          type: string
        label:
          type: [string, "null"]

    ApiKeyView:
      type: object
      required: [prefix, created_at, revoked]
      properties:
        prefix:
          type: string
        label:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        revoked:
          type: boolean

    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyView"

    DashboardSummary:
      type: object
      required: [counts, recent]
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
        recent:
          type: array
          items:
            $ref: "#/components/schemas/Document"
