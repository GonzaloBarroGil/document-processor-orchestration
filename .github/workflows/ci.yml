name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OpenAPI YAML
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('docs/contracts/openapi.yaml')); print('openapi.yaml: valid YAML')"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Spectral lint
        run: npx @stoplight/spectral-cli lint docs/contracts/openapi.yaml
